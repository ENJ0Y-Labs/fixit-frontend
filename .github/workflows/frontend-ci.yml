name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "fixit-customer/**"
      - "fixit-provider/**"
      - "fixit-admin/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "fixit-customer/**"
      - "fixit-provider/**"
      - "fixit-admin/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - fixit-customer
          - fixit-provider
          - fixit-admin

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test -- --run

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build
